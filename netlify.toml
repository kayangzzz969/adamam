[build]
  publish = "."
  functions = "netlify/functions"

# API Route Rewrite ke Serverless Function Netlify Blobs
[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

# Akses cepat /admin ke /admin.html
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Header Security & CORS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
